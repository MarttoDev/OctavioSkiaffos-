    <style>
        /* --- CORRECCIÓN DE PESTAÑEO Y SALTO --- */
        html {
            background-color: black; 
            scrollbar-gutter: stable; 
        }

        body { 
            cursor: none; 
            background-color: black;
            overflow-x: hidden;
            width: 100%;
        } 

        /* FORZAR QUE NUNCA SALGA LA "MANITO" DEL NAVEGADOR */
        a, button, [type="button"], [type="submit"] {
            cursor: none !important;
        }
        
        /* Cursor mejorado */
        .cursor-dot {
            pointer-events: none; 
            z-index: 9999; 
            mix-blend-mode: difference;
            transition: width 0.3s ease, height 0.3s ease, opacity 0.3s ease, transform 0.1s ease;
            transform-origin: center;
        }

        /* --- ANIMACIONES DEL LOADER --- */
        @keyframes fadeOutLoader {
            to { opacity: 0; visibility: hidden; }
        }

        @keyframes moveText {
            0% { 
                top: 50%; 
                left: 50%; 
                transform: translate(-50%, -50%); 
                font-size: 3rem; 
            }
            100% { 
                top: 32px; 
                left: 32px; 
                transform: translate(0, 0); 
                font-size: 1.5rem; 
            }
        }

        .font-poppins {
            font-family: 'Poppins', sans-serif !important;
            font-weight: 600 !important; 
            letter-spacing: -0.02em;
        }

        .font-kantumruy {
            font-family: 'Kantumruy Pro', sans-serif;
        }

        .animate-fadeOutLoader { 
            animation: fadeOutLoader 1.5s ease-out forwards; 
        }
        .animate-moveText { 
            animation: moveText 1.8s cubic-bezier(0.65, 0, 0.35, 1) forwards; 
            will-change: transform, font-size, top, left;
            backface-visibility: hidden;
        }
        
    </style>
</head>

    <script>
        // --- 1. FORZAR SCROLL AL INICIO AL RECARGAR ---
        if (history.scrollRestoration) {
            history.scrollRestoration = 'manual';
        }
        window.scrollTo(0, 0);

        // --- 2. CURSOR ---
        const cursor = document.getElementById('cursor');
        
        const moveCursor = (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        }
        document.addEventListener('mousemove', moveCursor);

        document.addEventListener('mouseleave', () => {
            cursor.classList.add('opacity-0');
        });
        
        document.addEventListener('mouseenter', () => {
            cursor.classList.remove('opacity-0');
        });

        // --- 3. ANIMACIÓN CURSOR EN TODOS LOS LINKS ---

        // Scroll animation observer
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.remove('opacity-0', 'translate-y-20');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.animate-on-scroll').forEach((el) => {
            observer.observe(el);
        });

        // Efecto del nav (Scroll)
        const navBg = document.getElementById('nav-bg');
        const navbar = document.getElementById('navbar');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navBg.classList.replace('bg-black/0', 'bg-black'); 
                navBg.classList.replace('backdrop-blur-0', 'backdrop-blur-md');
                navbar.classList.replace('py-8', 'py-4');
            } else {
                navBg.classList.replace('bg-black', 'bg-black/0'); 
                navBg.classList.replace('backdrop-blur-md', 'backdrop-blur-0');
                navbar.classList.replace('py-4', 'py-8');
            }
        });

        // --- SCRIPT DEL LOADER ---
        document.addEventListener('DOMContentLoaded', () => {
            const loader = document.getElementById('loader');
            const loaderText = document.getElementById('loader-text');
            const navElements = document.getElementById('navbar');

            // Asegurar bloqueo de scroll
            document.body.classList.add('overflow-hidden');
            window.scrollTo(0, 0);

            setTimeout(() => {
                loaderText.classList.add('animate-moveText');
            }, 300);

            loaderText.addEventListener('animationend', () => {
                loader.classList.add('animate-fadeOutLoader');
                
                setTimeout(() => {
                    loader.style.display = 'none'; 
                    document.body.classList.remove('overflow-hidden'); 
                    navElements.classList.remove('opacity-0'); 
                }, 1400); 
            });
        });
    </script>
