    <style>
        /* --- RESET Y BASE --- */
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; 
            
            /* FONDO GRIS PIEDRA (Stone Grey) */
            background-color: #d6d6d6;
            background-image: radial-gradient(circle at center, #e3e3e3 0%, #bfbfbf 100%);
            
            color: #0a0a0a; /* Texto casi negro */
        }

        /* --- TEXTURA DE RUIDO --- */
        .noise {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50; 
            opacity: 0.08; 
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        
        /* --- CURSOR --- */
        .cursor-dot {
            pointer-events: none; z-index: 9999; mix-blend-mode: difference;
            background-color: white; /* Invertirá a negro */
            transition: opacity 0.3s ease, transform 0.1s ease;
        }

        /* --- CONTENEDOR PRINCIPAL DEL SCROLL --- */
        .horizontal-scroll-container {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex; flex-wrap: nowrap; align-items: center; 
            padding-left: 10vw; padding-right: 10vw; 
            gap: 15vw; 
            overflow-x: auto; overflow-y: hidden;  
            -ms-overflow-style: none; scrollbar-width: none;     
        }
        .horizontal-scroll-container::-webkit-scrollbar { display: none; }

        /* --- GRUPO DE ALBUM --- */
        .album-group {
            display: flex;
            gap: 4vw; 
            align-items: center;
            flex: 0 0 auto; 
        }

        /* --- TEXTO LATERAL DEL ALBUM --- */
        .album-header {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 70vh; 
            padding-bottom: 10px;
            margin-right: 2vw;
            border-right: 1px solid rgba(0,0,0,0.1);
            padding-right: 4vw;
        }
        .album-title {
            font-family: 'Zen Kaku Gothic Antique', sans-serif;
            font-weight: 900;
            font-size: 3rem;
            line-height: 0.9;
            text-transform: uppercase;
            color: #000000;
            white-space: nowrap;
        }
        .album-year {
            font-family: monospace;
            color: #666;
            margin-top: 1rem;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
        }

        /* --- FOTOS (A COLOR) --- */
        .img-wrapper {
            flex: 0 0 auto; position: relative;
            box-shadow: 0 20px 40px -20px rgba(0,0,0,0.2);
        }

        .fashion-img {
            height: 70vh; 
            width: auto; 
            max-width: none; 
            object-fit: cover;
            /* SIN FILTROS - COLOR REAL */
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .fashion-img:hover {
            transform: scale(1.02);
        }

        /* --- CONTROLES INFERIORES (START / END / BARRA) --- */
        .bottom-controls {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 60;
            /* Ajuste para móviles */
            width: 90%;
            justify-content: center;
        }

        .nav-btn {
            font-family: monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #666;
            cursor: pointer;
            background: none; border: none;
            transition: color 0.3s ease, transform 0.2s ease;
        }
        .nav-btn:hover {
            color: #000;
            transform: scale(1.1);
        }

        .progress-bar {
            position: relative;
            width: 300px; /* Ancho fijo para escritorio */
            height: 2px;
            background: rgba(0,0,0,0.05);
        }
        .progress-fill {
            height: 100%; 
            background: #1a1a1a;
            width: 0%; transition: width 0.1s linear;
        }
        
        /* Ajuste responsivo para la barra */
        @media (max-width: 768px) {
            .progress-bar { width: 150px; }
        }
    </style>
</head>

    <script>
        // --- SCRIPT DE MOVIMIENTO FLUIDO (LERP) ---
        const container = document.getElementById('scroll-container');
        const progressBar = document.getElementById('progress-fill');
        const btnStart = document.getElementById('btn-start');
        const btnEnd = document.getElementById('btn-end');
        
        let currentScroll = 0;  
        let targetScroll = 0;   
        let isScrolling = false;
        const ease = 0.08; 

        // 1. Scroll con Rueda / Trackpad
        window.addEventListener('wheel', (e) => {
            e.preventDefault(); 
            const delta = (e.deltaY + e.deltaX) * 2.5; 
            targetScroll += delta;
            updateConstraints();
            startAnimation();
        }, { passive: false });

        // 2. Click en Botón Inicio
        btnStart.addEventListener('click', () => {
            targetScroll = 0;
            startAnimation();
        });

        // 3. Click en Botón Fin
        btnEnd.addEventListener('click', () => {
            targetScroll = container.scrollWidth - window.innerWidth;
            startAnimation();
        });

        // Auxiliares
        function updateConstraints() {
            const maxScroll = container.scrollWidth - window.innerWidth;
            targetScroll = Math.max(0, Math.min(targetScroll, maxScroll));
        }

        function startAnimation() {
            if (!isScrolling) {
                isScrolling = true;
                requestAnimationFrame(animateScroll);
            }
        }

        // Loop de Animación
        function animateScroll() {
            currentScroll += (targetScroll - currentScroll) * ease;
            container.scrollLeft = currentScroll;

            const maxScroll = container.scrollWidth - window.innerWidth;
            if (maxScroll > 0) {
                const percent = (currentScroll / maxScroll) * 100;
                progressBar.style.width = percent + '%';
            }

            // Parar si ya llegamos
            if (Math.abs(targetScroll - currentScroll) > 0.5) {
                requestAnimationFrame(animateScroll);
            } else {
                isScrolling = false;
            }
        }

        // --- CURSOR ---
        const cursor = document.getElementById('cursor');
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // Hover Effect
        document.querySelectorAll('.fashion-img').forEach(img => {
            img.addEventListener('mouseenter', () => {
                cursor.style.transform = "translate(-50%, -50%) scale(2.5)";
                cursor.style.mixBlendMode = "difference";
            });
            img.addEventListener('mouseleave', () => {
                cursor.style.transform = "translate(-50%, -50%) scale(1)";
            });
        });
    </script>
