    <style>
        /* --- CURSOR NUCLEAR: OCULTAR TODO --- */
        * { cursor: none !important; }

        /* --- RESET Y BASE --- */
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; 
            background-color: #ffffff; /* Default: Blanco */
            color: #000000; 
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        /* --- TEXTURA DE RUIDO --- */
        .noise {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50; 
            opacity: 0.05; 
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        
        /* --- CURSOR PERSONALIZADO --- */
        .cursor-dot {
            pointer-events: none; z-index: 9999; 
            mix-blend-mode: difference;
            background-color: white; 
            transition: transform 0.15s ease-out; 
        }

        /* --- CONTENEDOR PRINCIPAL DEL SCROLL --- */
        .horizontal-scroll-container {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex; flex-wrap: nowrap; align-items: center; 
            padding-left: 10vw; padding-right: 10vw; 
            gap: 15vw; 
            overflow-x: auto; overflow-y: hidden;  
            -ms-overflow-style: none; scrollbar-width: none;     
        }
        .horizontal-scroll-container::-webkit-scrollbar { display: none; }

        /* --- GRUPO DE ALBUM --- */
        .album-group {
            display: flex; gap: 4vw; align-items: center;
            flex: 0 0 auto; position: relative;
        }

        /* --- TEXTO LATERAL DEL ALBUM --- */
        .album-header {
            display: flex; flex-direction: column; justify-content: flex-end;
            height: 70vh; padding-bottom: 10px; margin-right: 2vw;
            border-right: 1px solid currentColor; 
            border-right-color: rgba(125, 125, 125, 0.3); 
            padding-right: 4vw;
        }
        .album-title {
            font-family: 'Zen Kaku Gothic Antique', sans-serif;
            font-weight: 900; font-size: 3rem; line-height: 0.9;
            text-transform: uppercase; white-space: nowrap;
            color: inherit; 
        }
        .album-year {
            font-family: monospace;
            opacity: 0.6; 
            margin-top: 1rem; font-size: 0.8rem; letter-spacing: 0.2em;
        }

        /* --- FOTOS --- */
        .img-wrapper { flex: 0 0 auto; position: relative; box-shadow: none; }

        .fashion-img {
            height: 70vh; width: auto; max-width: none; object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .fashion-img:hover { transform: scale(1.02); }

        /* --- CONTROLES INFERIORES --- */
        .bottom-controls {
            position: fixed; bottom: 40px; left: 50%;
            transform: translateX(-50%);
            display: flex; align-items: center; justify-content: center;
            z-index: 60; width: auto;
            gap: 40px; /* Más espacio entre selectores y timeline */
        }

        /* SELECTOR DE COLOR (MODIFICADO: Cuadrados grandes) */
        .theme-switcher {
            display: flex; gap: 15px; /* Separación entre botones */
        }
        .theme-btn {
            width: 30px; height: 30px; /* Tamaño clickeable grande */
            border: 1px solid rgba(0,0,0,0.2);
            transition: transform 0.2s ease, border-color 0.2s ease;
            /* Sin border-radius = Cuadrados */
        }
        .theme-btn:hover { transform: scale(1.2); }

        /* BARRA DE PROGRESO (MODIFICADA: Más grande) */
        .progress-bar {
            position: relative; 
            width: 600px; /* Más ancha */
            height: 4px;  /* Más gruesa */
            background: rgba(125,125,125, 0.3); 
            display: flex; align-items: center;
        }
        .progress-fill {
            height: 100%; width: 0%;
            background: currentColor; 
        }
        
        /* PUNTOS DE NAVEGACIÓN (WAYPOINTS - Ajustados) */
        .timeline-marker {
            position: absolute; top: 50%; transform: translate(-50%, -50%);
            width: 16px; height: 16px; /* Puntos más grandes */
            background-color: inherit; 
            border: 1px solid currentColor;
            border-radius: 50%; /* Los puntos siguen siendo redondos */
            z-index: 10;
            transition: transform 0.2s ease;
        }
        .timeline-marker:hover {
            transform: translate(-50%, -50%) scale(1.5);
        }

        @media (max-width: 768px) {
            .progress-bar { width: 250px; }
            .bottom-controls { gap: 20px; bottom: 20px; flex-direction: column; }
            .album-header { height: 50vh; }
            .fashion-img { height: 50vh; }
        }
    </style>

    <script>
        // --- SCRIPT DE MOVIMIENTO FLUIDO (LERP) ---
        const container = document.getElementById('scroll-container');
        const progressBar = document.getElementById('progress-fill');
        const timelineTrack = document.getElementById('timeline-track');
        const albumGroups = document.querySelectorAll('.album-group');
        const backBtn = document.getElementById('back-btn');
        
        let currentScroll = 0;  
        let targetScroll = 0;   
        let isScrolling = false;
        const ease = 0.08; 

        // --- LÓGICA DE TEMAS (COLORES) ---
        function setTheme(mode) {
            const body = document.body;
            // Los marcadores se generan dinámicamente, así que los seleccionamos aquí
            const markers = document.querySelectorAll('.timeline-marker');

            if (mode === 'white') {
                // Fondo Blanco, Texto Negro
                body.style.backgroundColor = '#ffffff';
                body.style.color = '#000000';
                backBtn.style.color = 'rgba(0,0,0,0.5)';
                
                // Marcadores: Fondo Blanco, Borde Negro
                markers.forEach(m => {
                    m.style.backgroundColor = '#ffffff';
                    m.style.borderColor = '#000000';
                });

            } else if (mode === 'gray') {
                // Fondo Gris, Texto Negro
                body.style.backgroundColor = '#b0b0b0';
                body.style.color = '#000000';
                backBtn.style.color = 'rgba(0,0,0,0.5)';
                
                // Marcadores: Fondo Gris, Borde Negro
                markers.forEach(m => {
                    m.style.backgroundColor = '#b0b0b0';
                    m.style.borderColor = '#000000';
                });

            } else if (mode === 'black') {
                // Fondo Negro, Texto Blanco
                body.style.backgroundColor = '#000000';
                body.style.color = '#ffffff';
                backBtn.style.color = 'rgba(255,255,255,0.5)';
                
                // Marcadores: Fondo Negro, Borde Blanco
                markers.forEach(m => {
                    m.style.backgroundColor = '#000000';
                    m.style.borderColor = '#ffffff';
                });
            }
        }

        // 0. GENERAR PUNTOS EN LA LÍNEA DE TIEMPO (Waypoints)
        window.addEventListener('load', () => {
            const maxScroll = container.scrollWidth - window.innerWidth;
            
            albumGroups.forEach((group) => {
                const leftPos = group.offsetLeft;
                const scrollPercent = (leftPos / maxScroll) * 100;

                const marker = document.createElement('div');
                marker.classList.add('timeline-marker');
                marker.style.left = `${Math.min(scrollPercent, 100)}%`;
                
                // Inicializar colores del marcador (Default Blanco)
                marker.style.backgroundColor = '#ffffff';
                marker.style.borderColor = '#000000';

                marker.addEventListener('click', (e) => {
                    e.stopPropagation(); 
                    targetScroll = leftPos;
                    updateConstraints();
                    startAnimation();
                });
                
                timelineTrack.appendChild(marker);
            });
        });

        // 1. Scroll con Rueda / Trackpad
        window.addEventListener('wheel', (e) => {
            e.preventDefault(); 
            const delta = (e.deltaY + e.deltaX) * 2.5; 
            targetScroll += delta;
            updateConstraints();
            startAnimation();
        }, { passive: false });

        function updateConstraints() {
            const maxScroll = container.scrollWidth - window.innerWidth;
            targetScroll = Math.max(0, Math.min(targetScroll, maxScroll));
        }

        function startAnimation() {
            if (!isScrolling) {
                isScrolling = true;
                requestAnimationFrame(animateScroll);
            }
        }

        function animateScroll() {
            currentScroll += (targetScroll - currentScroll) * ease;
            container.scrollLeft = currentScroll;

            const maxScroll = container.scrollWidth - window.innerWidth;
            if (maxScroll > 0) {
                const percent = (currentScroll / maxScroll) * 100;
                progressBar.style.width = percent + '%';
            }

            if (Math.abs(targetScroll - currentScroll) > 0.5) {
                requestAnimationFrame(animateScroll);
            } else {
                isScrolling = false;
            }
        }

        // --- CURSOR ---
        const cursor = document.getElementById('cursor');
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

    </script>
