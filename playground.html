    <style>
        /* --- BASE --- */
        html, body {
            margin: 0; padding: 0;
            width: 100%; 
            /* El alto se definirá dinámicamente con JS para crear la barra de scroll */
            background-color: black;
            color: white;
            cursor: none; 
            overflow-x: hidden;
        }

        /* --- CONTENEDOR FIJO (LA PANTALLA QUE VEMOS) --- */
        .fixed-viewport {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100vh;
            display: flex;
            overflow: hidden; /* Ocultamos lo que se sale por arriba/abajo */
        }

        /* --- LAS DOS COLUMNAS --- */
        .col-left, .col-right {
            width: 50%;
            position: absolute;
            top: 0;
            display: flex;
            flex-direction: column;
            will-change: transform; /* Optimización de rendimiento */
        }

        .col-left {
            left: 0;
            /* La izquierda empieza arriba (top: 0) y sube */
        }

        .col-right {
            right: 0;
            /* La derecha se posicionará vía JS para empezar desde abajo */
        }

        /* --- LA FOTO --- */
        .grid-item {
            position: relative;
            width: 100%;
            /* Altura de cada foto (ajusta si quieres más/menos fotos por pantalla) */
            height: 60vh; 
            overflow: hidden;
        }

        .grid-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* --- OVERLAY TEXTO --- */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .project-title {
            font-family: 'Zen Kaku Gothic Antique', sans-serif;
            font-weight: 900;
            font-size: 2vw;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transform: translateY(30px);
            transition: transform 0.4s ease;
        }

        /* --- HOVER --- */
        .grid-item:hover .grid-img { transform: scale(1.05); }
        .grid-item:hover .overlay { opacity: 1; }
        .grid-item:hover .project-title { transform: translateY(0); }

        /* --- CURSOR --- */
        .cursor-dot {
            pointer-events: none; z-index: 9999; mix-blend-mode: difference;
            background-color: white;
            transition: width 0.3s, height 0.3s, opacity 0.3s;
        }

        /* --- RESPONSIVE (CELULAR) --- */
        /* En móvil este efecto no funciona bien, así que lo apilamos normal */
        @media (max-width: 768px) {
            .fixed-viewport { position: relative; height: auto; flex-direction: column; }
            .col-left, .col-right { width: 100%; position: relative; top: auto; left: auto; right: auto; transform: none !important; }
            .grid-item { height: 50vh; }
        }
    </style>
</head>

    <div id="scroll-proxy"></div>

    <script>
        // --- LOGICA BIDIRECCIONAL (Solo Desktop) ---
        const colLeft = document.getElementById('col-left');
        const colRight = document.getElementById('col-right');
        const scrollProxy = document.getElementById('scroll-proxy');
        
        let currentScroll = 0;
        let targetScroll = 0;
        const ease = 0.08; // Suavidad

        function init() {
            // Solo activar en pantallas grandes
            if (window.innerWidth > 768) {
                // 1. Calcular altura total necesaria
                // La altura de la columna más larga define cuanto scroll necesitamos
                const leftHeight = colLeft.offsetHeight;
                const rightHeight = colRight.offsetHeight;
                const totalContentHeight = Math.max(leftHeight, rightHeight);
                
                // Ajustamos el div fantasma para que el navegador muestre la barra de scroll correcta
                // El scroll total debe permitir recorrer toda la columna más larga
                scrollProxy.style.height = totalContentHeight + 'px';
                
                // Empezar loop
                animate();
            }
        }

        function animate() {
            // Lerp para suavidad
            targetScroll = window.scrollY;
            currentScroll += (targetScroll - currentScroll) * ease;
            
            // --- MATEMÁTICA DEL MOVIMIENTO ---
            
            // Columna Izquierda: Se mueve NORMAL (Sube)
            // Simplemente la desplazamos hacia arriba según el scroll
            const leftMove = -currentScroll;
            
            // Columna Derecha: Se mueve INVERTIDO (Baja)
            // Debe empezar "escondida arriba" (o abajo, según el efecto).
            // Para el efecto "cruce":
            // Debe empezar en: -(AlturaTotal - AlturaPantalla) -> Es decir, mostrando el final.
            // Y moverse hacia abajo sumando el scroll.
            
            const rightHeight = colRight.offsetHeight;
            const windowHeight = window.innerHeight;
            
            // Posición Inicial: Alineada al fondo (scrolleada al maximo)
            const rightStart = -(rightHeight - windowHeight);
            
            // Movimiento: Posición Inicial + Scroll
            const rightMove = rightStart + currentScroll;

            // Aplicar transformaciones
            colLeft.style.transform = `translate3d(0, ${leftMove}px, 0)`;
            colRight.style.transform = `translate3d(0, ${rightMove}px, 0)`;

            requestAnimationFrame(animate);
        }

        // Iniciar y recalcular si cambian el tamaño de ventana
        window.addEventListener('load', init);
        window.addEventListener('resize', init);


        // --- CURSOR ---
        const cursor = document.getElementById('cursor');
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.querySelectorAll('.grid-item').forEach(item => {
            item.addEventListener('mouseenter', () => {
                cursor.style.transform = "translate(-50%, -50%) scale(2.5)";
                cursor.style.mixBlendMode = "normal";
                cursor.style.opacity = "0.8";
            });
            item.addEventListener('mouseleave', () => {
                cursor.style.transform = "translate(-50%, -50%) scale(1)";
                cursor.style.mixBlendMode = "difference";
                cursor.style.opacity = "1";
            });
        });

    </script>
