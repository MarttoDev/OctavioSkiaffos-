<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAYGROUND | OCTAVIOSKIAFFOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #0a0a0a; color: white; cursor: none; overflow: hidden; height: 100vh; width: 100vw; user-select: none; }
        .cursor-dot { pointer-events: none; z-index: 9999; mix-blend-mode: difference; transition: transform 0.1s; }
        body.is-dragging .cursor-dot { transform: translate(-50%, -50%) scale(3); background-color: red; mix-blend-mode: normal; opacity: 0.5; }
        .noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; opacity: 0.05; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); }

        #canvas { position: absolute; top: 0; left: 0; width: 300vw; height: 300vh; transform: translate(-30%, -30%); will-change: transform; cursor: none; }
        .photo-card { position: absolute; transition: transform 0.3s ease; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .photo-card:hover { z-index: 40; transform: scale(1.1) !important; filter: brightness(1.2); }
    </style>
</head>
<body>
    <div class="noise"></div>
    <div id="cursor" class="cursor-dot fixed w-4 h-4 bg-white rounded-full transform -translate-x-1/2 -translate-y-1/2"></div>
    
    <div class="fixed top-8 left-8 z-[60] pointer-events-none mix-blend-difference">
        <a href="gallery1.html" class="pointer-events-auto text-xs font-mono tracking-[0.3em] uppercase text-white hover:text-red-500 transition">&larr; Back</a>
    </div>
    <div class="fixed bottom-8 right-8 z-[60] text-right pointer-events-none mix-blend-difference">
        <p class="text-xs font-mono tracking-widest text-white">DRAG TO EXPLORE</p>
    </div>

    <div id="canvas">
        <div class="photo-card" style="top: 20%; left: 20%; transform: rotate(-5deg); width: 20vw;">
            <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop" class="w-full">
        </div>
        <div class="photo-card" style="top: 40%; left: 35%; transform: rotate(10deg); width: 15vw;">
            <img src="https://images.unsplash.com/photo-1573455494060-c5595004fb6c?q=80&w=2040&auto=format&fit=crop" class="w-full grayscale">
        </div>
        <div class="photo-card" style="top: 60%; left: 50%; transform: rotate(-8deg); width: 25vw;">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1964&auto=format&fit=crop" class="w-full">
            <h2 class="font-serif italic text-4xl absolute -top-10 -right-10 mix-blend-difference">Chaos</h2>
        </div>
        <div class="photo-card" style="top: 15%; left: 60%; transform: rotate(15deg); width: 18vw;">
            <img src="https://images.unsplash.com/photo-1494232410401-ad00d5433cfa?q=80&w=2070&auto=format&fit=crop" class="w-full grayscale">
        </div>
        <div class="photo-card" style="top: 50%; left: 15%; transform: rotate(-15deg); width: 12vw;">
            <img src="https://images.unsplash.com/photo-1550133730-69524bb9e487?q=80&w=2070&auto=format&fit=crop" class="w-full">
        </div>
    </div>

    <script>
        const cursor = document.getElementById('cursor');
        const moveCursor = (e) => { cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px'; }
        window.addEventListener('mousemove', moveCursor);

        const canvas = document.getElementById('canvas');
        let isDragging = false, startX, startY, currentX = -window.innerWidth * 0.3, currentY = -window.innerHeight * 0.3;

        window.addEventListener('mousedown', (e) => {
            if(e.target.tagName === 'A') return;
            isDragging = true; document.body.classList.add('is-dragging');
            startX = e.clientX; startY = e.clientY;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const newX = currentX + (e.clientX - startX);
            const newY = currentY + (e.clientY - startY);
            canvas.style.transform = `translate(${newX}px, ${newY}px)`;
        });
        window.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false; document.body.classList.remove('is-dragging');
            currentX += (e.clientX - startX); currentY += (e.clientY - startY);
        });
    </script>
</body>
</html>
