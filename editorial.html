    <style>
        /* --- BASE --- */
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #050505;
            color: white;
            overflow: hidden; /* IMPORTANTE: Sin scroll nativo */
            cursor: none;
        }

        /* --- CONTENEDOR MAESTRO --- */
        .film-container {
            position: fixed;
            top: 50%; left: 50%;
            /* Escalamos un poco más para cubrir bordes al rotar */
            transform: translate(-50%, -50%) rotate(-15deg) scale(1.4);
            width: 140vw; /* Más ancho para caber más columnas */
            height: 150vh;
            display: flex;
            justify-content: center;
            gap: 1.5vw; /* Gap más pequeño */
            will-change: transform;
            pointer-events: none; 
        }

        /* --- COLUMNAS --- */
        .film-strip {
            display: flex;
            flex-direction: column;
            gap: 1.5vw;
            width: 9vw; /* FOTOS MUCHO MÁS CHICAS (Antes 20vw) */
            will-change: transform;
            padding-bottom: 1.5vw; 
        }

        /* --- LAS FOTOS --- */
        .film-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 2/3; 
            overflow: hidden;
            background: #111;
            cursor: none;
            pointer-events: auto;
            flex-shrink: 0; 
        }
        
        .film-img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        .film-frame:hover .film-img {
            transform: scale(1.1);
        }

        /* --- LIGHTBOX --- */
        .lightbox {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.95);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0; 
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .lightbox.active { opacity: 1; pointer-events: auto; }

        .lightbox-img {
            max-width: 85vw; max-height: 85vh;
            object-fit: contain;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .lightbox.active .lightbox-img { transform: scale(1); }

        .close-btn {
            position: absolute; top: 40px; right: 40px;
            font-family: 'Zen Kaku Gothic Antique', sans-serif;
            font-size: 1.2rem; color: white; cursor: pointer; z-index: 101;
            border: 1px solid white; padding: 5px 15px; border-radius: 50px;
            transition: all 0.3s;
        }
        .close-btn:hover { background: white; color: black; }

        /* --- CURSOR --- */
        .cursor-dot {
            pointer-events: none; z-index: 9999; mix-blend-mode: difference;
            background-color: white;
            transition: width 0.3s, height 0.3s, opacity 0.3s;
        }
        .cursor-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 10px; font-family: monospace; color: black; opacity: 0; font-weight: bold;
        }
    </style>
</head>

    </div>

    <script>
        // --- 1. CLONACIÓN AUTOMÁTICA (Para el Loop Infinito) ---
        const strips = document.querySelectorAll('.film-strip');
        
        strips.forEach(strip => {
            // Clonamos 3 veces para asegurar que en pantallas grandes y con items pequeños no se vea corte
            const content = strip.innerHTML;
            strip.innerHTML = content + content + content + content; 
        });


        // --- 2. LÓGICA DE ESCALERA MECÁNICA (Loop Infinito) ---
        let virtualScroll = 0; 
        let targetScroll = 0;
        const ease = 0.08;
        
        window.addEventListener('wheel', (e) => {
            targetScroll += e.deltaY;
        });

        function animate() {
            virtualScroll += (targetScroll - virtualScroll) * ease;

            strips.forEach(strip => {
                const speed = parseFloat(strip.getAttribute('data-speed'));
                const direction = parseFloat(strip.getAttribute('data-direction')); 
                
                let pos = virtualScroll * speed * direction;

                // Dividimos por 4 porque cuadruplicamos el contenido
                const stripHeight = strip.scrollHeight / 4;

                const wrappedPos = ((pos % stripHeight) + stripHeight) % stripHeight;
                const finalPos = wrappedPos - stripHeight; 

                strip.style.transform = `translateY(${finalPos}px)`;
            });

            requestAnimationFrame(animate);
        }
        
        animate();


        // --- 3. LÓGICA LIGHTBOX ---
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('close-lightbox');
        
        document.querySelector('.film-container').addEventListener('click', (e) => {
            const frame = e.target.closest('.film-frame');
            if (frame) {
                const img = frame.querySelector('img');
                lightboxImg.src = img.src;
                lightbox.classList.add('active');
            }
        });

        const closeLightbox = () => lightbox.classList.remove('active');
        closeBtn.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });


        // --- 4. CURSOR ---
        const cursor = document.getElementById('cursor');
        const cursorText = document.querySelector('.cursor-text');
        
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.querySelector('.film-container').addEventListener('mouseover', (e) => {
            if (e.target.closest('.film-frame')) {
                cursor.style.transform = "translate(-50%, -50%) scale(4)";
                cursor.style.mixBlendMode = "normal";
                cursorText.style.opacity = "1";
            }
        });
        document.querySelector('.film-container').addEventListener('mouseout', (e) => {
             if (e.target.closest('.film-frame')) {
                cursor.style.transform = "translate(-50%, -50%) scale(1)";
                cursor.style.mixBlendMode = "difference";
                cursorText.style.opacity = "0";
             }
        });

        closeBtn.addEventListener('mouseenter', () => {
             cursor.style.transform = "translate(-50%, -50%) scale(3)";
             cursor.style.backgroundColor = "red";
             cursorText.style.opacity = "0";
        });
        closeBtn.addEventListener('mouseleave', () => {
             cursor.style.transform = "translate(-50%, -50%) scale(1)";
             cursor.style.backgroundColor = "white";
        });

    </script>
